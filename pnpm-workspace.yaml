allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  prisma: true
  unrs-resolver: true
overrides:
  # Transitive dep of @nestjs/platform-express; 2.2.0 has HIGH DoS advisories
  # (GHSA-wc9g-mqfw-jrwm, CVE-2026-77037), fixed in >=2.3.0.
  multer: ^2.4.0
  body-parser: ^2.3.0
  mysql2: ^3.24.3
  qs: ^6.16.0
  # brace-expansion / fast-uri: re-pinned past advisories published after the
  # original pins (brace-expansion DoS/CPU DoS in <1.1.21, <2.1.7, <5.0.12;
  # fast-uri host normalization in <3.1.8).
  'brace-expansion@1': ^1.1.21
  'form-data@4': 4.0.6
  'js-yaml@3': 3.15.2
  'js-yaml@4': 4.3.2
  'brace-expansion@2': ^2.1.7
  'brace-expansion@5': ^5.0.12
  'fast-uri@3': ^3.1.8
  browserslist: ^4.28.8
  # Transitive dep of express; GHSA-jqcg-44mw-7w3h (CRITICAL, CVSS 9.1, IP spoofing
  # via IPv4-mapped IPv6 trust subnet), fixed in 2.0.8.
  proxy-addr: ^2.0.8
  # Transitive dep of @nestjs/swagger; GHSA-r3ph-w7gj-g6xm (moderate, CPU DoS via
  # unbounded merge sources), fixed in 5.4.1.
  'js-yaml@5': ^5.4.1
