name: 'Trivy Security Scan'

on:
  push:
    branches: ['main', 'develop', 'dev', 'release/*']
  pull_request:
    branches: ['main', 'develop', 'dev', 'release/*']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Trivy vulnerability scanner
        id: trivy-step
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          exit-code: '1'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Report Trivy Results to PR
        uses: periphery-security/action-privy@0d796ad35ba254f839fd4781d277c06018c52410
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          trivy-results: 'trivy-results.json'

      - name: Fail job if vulnerabilities were found
        if: steps.trivy-step.outcome == 'failure'
        run: |
          echo "Se detectaron vulnerabilidades críticas o altas en el proyecto."
          exit 1
