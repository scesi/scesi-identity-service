name: CI - ms-identity

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

jobs:
  integracion-continua:
    name: Revisión y Construcción
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm ci

      - name: Revisión de formato (Prettier)
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Revisión de código (ESLint)
        run: pnpm exec eslint "src/**/*.ts" "test/**/*.ts"

      - name: Pruebas automatizadas
        run: npm run test

      - name: Construir proyecto (Build)
        run: npm run build
