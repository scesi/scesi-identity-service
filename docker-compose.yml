services:
  postgres:
    image: postgres:15-alpine
    container_name: scesi-identity-db
    environment:
      POSTGRES_DB: scesi_identity_dev
      POSTGRES_USER: scesi_user
      POSTGRES_PASSWORD: scesi_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scesi_user -d scesi_identity_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: scesi-identity-adminer
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
